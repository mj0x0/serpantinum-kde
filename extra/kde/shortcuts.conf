# Every shell action the installer registers as a KDE global shortcut.
#
# install.sh turns this into ~/.local/share/kglobalaccel/org.serpantinum.shell.desktop:
# one "Serpantinum" application under Applications in System Settings -> Shortcuts, one row
# per section below, all of them UNBOUND. Assign keys there. This file is no longer
# importable by KDE — importing it would recreate one separate custom command per section.
#
# The section name is the action id. It is the kglobalshortcutsrc key
# ([services][org.serpantinum.shell.desktop] <id>=<key>), so renaming one silently drops
# whoever had it bound. Name= is the label System Settings shows, sorted alphabetically.
# Suggested= is only ever printed; it is never written anywhere.
#
# Meta+Alt+S is also org.kde.screenreader.desktop's toggleScreenReader default.
#
# @SHELL_NAME@ is the installed config name, @SHELL_DIR@ the directory it lives in.

[bluetooth]
Name=Bluetooth
Exec=qs -c @SHELL_NAME@ ipc call bluetooth toggle
Suggested=Meta+B

[calendar]
Name=Calendar
Exec=qs -c @SHELL_NAME@ ipc call calendar toggle
Suggested=Meta+C

