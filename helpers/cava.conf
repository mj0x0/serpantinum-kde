# cava config for the MusicPopup album-art visualizer.
# Emits 12 frequency-band levels (0-100) as one ";"-separated line per frame on
# stdout; MusicPopup.qml reads them via a SplitParser and drives the Canvas.
# Launched only while the popup is open AND music is Playing.

[general]
bars = 12
framerate = 60
# autosens keeps levels well-scaled across quiet/loud tracks.
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100

[smoothing]
# Light monstercat-style smoothing so bars glide instead of jitter.
monstercat = 1.2
waves = 0
noise_reduction = 30
